<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ARsketch">
  <title>ARsketch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <video id="cam" autoplay muted playsinline></video>
    <div id="overlay">
      <img id="img" alt="" hidden>
    </div>
    <p id="msg">사진을 불러오세요</p>
  </main>

  <section id="panel">
    <div class="row">
      <label class="btn primary" for="file">사진 불러오기</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="flipX" class="btn" type="button">좌우 반전</button>
      <button id="flipY" class="btn" type="button">상하 반전</button>
    </div>
    <div class="row">
      <span class="label">투명도</span>
      <input id="opacity" type="range" min="5" max="100" value="50">
      <span id="opacityVal" class="value">50%</span>
      <button id="lock" class="btn" type="button" aria-pressed="false">잠금 해제됨</button>
    </div>
  </section>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var cam = document.getElementById('cam');
      var img = document.getElementById('img');
      var msg = document.getElementById('msg');
      var fileInput = document.getElementById('file');
      var opacity = document.getElementById('opacity');
      var opacityVal = document.getElementById('opacityVal');
      var lockBtn = document.getElementById('lock');

      var state = { x: 0, y: 0, scale: 1, rot: 0, fx: 1, fy: 1, locked: false };

      function apply() {
        img.style.transform =
          'translate(' + state.x + 'px,' + state.y + 'px) ' +
          'rotate(' + state.rot + 'rad) ' +
          'scale(' + (state.scale * state.fx) + ',' + (state.scale * state.fy) + ')';
      }

      // 카메라 (후면)
      function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          msg.textContent = '이 브라우저는 카메라를 지원하지 않아요 (HTTPS 필요)';
          return;
        }
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        }).then(function (stream) {
          cam.srcObject = stream;
        }).catch(function () {
          msg.textContent = '카메라 권한을 허용해 주세요';
        });
      }
      startCamera();

      // 사진 불러오기
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
        var url = URL.createObjectURL(f);
        img.dataset.url = url;
        img.onload = function () {
          img.hidden = false;
          msg.hidden = true;
          state.x = 0; state.y = 0; state.scale = 1; state.rot = 0;
          apply();
        };
        img.src = url;
        fileInput.value = '';
      });

      // 반전
      document.getElementById('flipX').addEventListener('click', function () {
        state.fx *= -1; apply();
      });
      document.getElementById('flipY').addEventListener('click', function () {
        state.fy *= -1; apply();
      });

      // 투명도
      function setOpacity() {
        img.style.opacity = opacity.value / 100;
        opacityVal.textContent = opacity.value + '%';
      }
      opacity.addEventListener('input', setOpacity);
      setOpacity();

      // 잠금
      lockBtn.addEventListener('click', function () {
        state.locked = !state.locked;
        lockBtn.textContent = state.locked ? '잠금됨' : '잠금 해제됨';
        lockBtn.setAttribute('aria-pressed', state.locked);
        lockBtn.classList.toggle('active', state.locked);
        stage.classList.toggle('locked', state.locked);
        pointers.clear();
      });

      // 제스처: 한 손가락 이동, 두 손가락 확대/회전
      var pointers = new Map();
      var last = null;

      function snapshot() {
        var pts = Array.from(pointers.values());
        if (pts.length === 1) {
          return { n: 1, cx: pts[0].x, cy: pts[0].y };
        }
        if (pts.length >= 2) {
          var a = pts[0], b = pts[1];
          var dx = b.x - a.x, dy = b.y - a.y;
          return {
            n: 2,
            cx: (a.x + b.x) / 2,
            cy: (a.y + b.y) / 2,
            dist: Math.hypot(dx, dy),
            ang: Math.atan2(dy, dx)
          };
        }
        return null;
      }

      stage.addEventListener('pointerdown', function (e) {
        if (state.locked || img.hidden) return;
        stage.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        last = snapshot();
      });

      stage.addEventListener('pointermove', function (e) {
        if (state.locked || !pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        var cur = snapshot();
        if (!cur || !last || cur.n !== last.n) { last = cur; return; }

        state.x += cur.cx - last.cx;
        state.y += cur.cy - last.cy;
        if (cur.n === 2) {
          if (last.dist > 0) state.scale *= cur.dist / last.dist;
          // 반전 상태와 무관하게 손가락 회전 방향대로 돌아가도록 보정
          state.rot += (cur.ang - last.ang) * state.fx * state.fy;
        }
        last = cur;
        apply();
      });

      function end(e) {
        pointers.delete(e.pointerId);
        last = snapshot();
      }
      stage.addEventListener('pointerup', end);
      stage.addEventListener('pointercancel', end);

      // iOS 사파리 기본 핀치 확대 방지
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); });
      });
    })();
  </script>
</body>
</html>
